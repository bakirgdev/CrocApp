name: Preview GitHub Pages

on:
  pull_request:
    paths:
      - "web/landing/**"
      - "web/docs/**"
      - "design/tokens.css"
      - "scripts/assemble-site.sh"
      - ".github/workflows/github-pages-preview.yml"

permissions:
  contents: read

concurrency:
  group: github-pages-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    name: Build preview

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # needed because Docusaurus's showLastUpdateTime reads each doc page's git history

      - name: Enable pnpm
        run: corepack enable pnpm && corepack prepare --activate
        working-directory: web/docs

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('web/docs/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Assemble _site
        run: scripts/assemble-site.sh
