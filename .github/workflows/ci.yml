name: CI pass

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # No workflow-level `paths:`: a filtered-out workflow never reports, which
  # leaves a required check pending forever. Jobs skip via `if:` instead.
  changes:
    name: changes

    runs-on: ubuntu-26.04

    timeout-minutes: 5

    outputs:
      swift: ${{ steps.filter.outputs.swift }}
      go: ${{ steps.filter.outputs.go }}
      build: ${{ steps.filter.outputs.build }}
      design: ${{ steps.filter.outputs.design }}
      interop: ${{ steps.filter.outputs.interop }}
      scripts: ${{ steps.filter.outputs.scripts }}
      site: ${{ steps.filter.outputs.site }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          # A new branch push has an all-zero `before`, a force push may point at
          # a commit the clone no longer has: run everything rather than guess.
          all=""
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          else
            files=""
            all=1
          fi

          out() {
            if [ -n "$all" ] || grep -qE "$2" <<<"$files"; then
              echo "$1=true"
            else
              echo "$1=false"
            fi
          }

          {
            out swift '^(app|CrocKit)/|^scripts/screenshots/|^\.swift-format$|^\.xcode-version$|^scripts/(lib|format-swift)\.sh$|^\.github/workflows/(ci|reusable-swift-format)\.yml$'
            out go '^crocmobile/|^\.github/workflows/(ci|reusable-go)\.yml$'
            out build '^(app|CrocKit|crocmobile)/|^scripts/(lib|build-xcframework)\.sh$|^\.xcode-version$|^\.github/workflows/ci\.yml$'
            out design '^design/|^app/.*\.swift$|^app/CrocApp/Assets\.xcassets/|^web/landing/.*\.(css|html|js)$|^web/landing/assets/img/favicon/site\.webmanifest$|^web/docs/src/(css/|prismTheme\.ts$)|^scripts/(lib|verify-design)\.sh$|^\.github/workflows/ci\.yml$'
            out interop '^(crocmobile|CrocKit)/|^scripts/(lib|verify-interop)\.sh$|^scripts/croc-v10\.version$|^\.github/workflows/ci\.yml$'
            out scripts '^scripts/.*\.sh$|^\.editorconfig$|^\.github/workflows/ci\.yml$'
            out site '^web/(landing|docs)/|^design/tokens\.css$|^scripts/(lib|assemble-site)\.sh$|^\.github/workflows/(ci|github-pages)\.yml$'
          } | tee -a "$GITHUB_OUTPUT"

  swift-format:
    needs: changes

    if: needs.changes.outputs.swift == 'true'

    uses: ./.github/workflows/reusable-swift-format.yml

  go:
    needs: changes

    if: needs.changes.outputs.go == 'true'

    uses: ./.github/workflows/reusable-go.yml

  contrast:
    name: design checks

    needs: changes

    if: needs.changes.outputs.design == 'true'

    runs-on: ubuntu-26.04

    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: scripts/verify-design.sh

  # The runner image ships shellcheck; shfmt comes pinned below.
  shellcheck:
    needs: changes

    if: needs.changes.outputs.scripts == 'true'

    runs-on: ubuntu-26.04

    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: shellcheck --version && shellcheck -x scripts/*.sh

      # Style from .editorconfig. Pinned by checksum; pin-watch reports new releases.
      - name: shfmt
        env:
          SHFMT_VERSION: v3.14.1
          SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
        run: |
          curl -fsSL -o "$RUNNER_TEMP/shfmt" \
            "https://github.com/mvdan/sh/releases/download/$SHFMT_VERSION/shfmt_${SHFMT_VERSION}_linux_amd64"
          echo "$SHFMT_SHA256  $RUNNER_TEMP/shfmt" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/shfmt"
          "$RUNNER_TEMP/shfmt" -d scripts

  # Unconditional: renaming or deleting any file can break a path a doc names,
  # and the check takes under a second.
  docs:
    name: docs checks

    runs-on: ubuntu-26.04

    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: scripts/verify-docs.sh

  # The deploy workflow's build, run before merge so a broken docs link or type
  # error fails the PR instead of the push to main.
  site:
    name: site build

    needs: changes

    if: needs.changes.outputs.site == 'true'

    runs-on: ubuntu-26.04

    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needed because Docusaurus's showLastUpdateTime reads each doc page's git history
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/docs/.nvmrc

      # Version from `packageManager`. Not corepack: Node 25+ no longer ships it.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/docs/package.json
          cache: true
          cache_dependency_path: web/docs/pnpm-lock.yaml

      - run: scripts/assemble-site.sh

      - run: pnpm --dir web/docs run typecheck

  # The interop harness, which starts its own relay on localhost (scripts/lib.sh),
  # never the public relays: those rate-limit a shared runner address and make
  # the run flaky. The public-pool scenario stays a local run (docs/BUILDING.md).
  interop:
    name: interop (local relay)

    needs: changes

    if: needs.changes.outputs.interop == 'true'

    runs-on: macos-26

    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: crocmobile/go.mod
          cache-dependency-path: crocmobile/go.sum

      # The CLI peers must match the croc the engine embeds (Homebrew's bottle
      # lagged at 11.5.0, which has no `croc store`) and the v10 test peer.
      - name: Read the croc CLI versions
        id: croc
        shell: bash
        run: |
          set -euo pipefail
          v11=$(cd crocmobile && go list -m -f '{{.Version}}' github.com/schollz/croc/v11)
          v10=$(cat scripts/croc-v10.version)
          echo "v11=$v11" >> "$GITHUB_OUTPUT"
          echo "v10=$v10" >> "$GITHUB_OUTPUT"

      # An exact-match key only: a binary of another version must never restore.
      - name: Restore the croc CLIs
        id: croc-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/croc-cli
          key: croc-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.croc.outputs.v11 }}-${{ steps.croc.outputs.v10 }}

      - name: Install the croc CLIs
        if: steps.croc-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          V11: ${{ steps.croc.outputs.v11 }}
          V10: ${{ steps.croc.outputs.v10 }}
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/croc-cli/v11" go install "github.com/schollz/croc/v11@$V11"
          GOBIN="$RUNNER_TEMP/croc-cli/v10" go install "github.com/schollz/croc/v10@$V10"

      # The script starts its own relay, with raised admission limits.
      - name: Interop against a local croc relay
        env:
          CROC: ${{ runner.temp }}/croc-cli/v11/croc
          CROC_V10: ${{ runner.temp }}/croc-cli/v10/croc
        run: scripts/verify-interop.sh

  build:
    name: build (${{ matrix.platform }})

    needs: changes

    if: needs.changes.outputs.build == 'true'

    runs-on: xcode-27

    timeout-minutes: 30

    strategy:
      fail-fast: false

      # `slices` binds only the xcframework slices a leg needs. The iOS leg
      # also binds the device slice, which no build here links, so a change
      # that breaks the device bind fails CI rather than the release. `action`
      # is `test` on macOS, which builds the app before it runs the tests.
      matrix:
        include:
          - platform: macOS
            destination: platform=macOS
            slices: macos/arm64
            action: test
          - platform: iOS Simulator
            destination: generic/platform=iOS Simulator
            slices: ios,iossimulator/arm64
            action: build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cache keys reject commas, so the slice list goes in as dashes.
      - id: xcode
        env:
          SLICES: ${{ matrix.slices }}
        run: |
          echo "version=$(cat .xcode-version)" >> "$GITHUB_OUTPUT"
          echo "slices=${SLICES//[,\/]/-}" >> "$GITHUB_OUTPUT"

      # The bind is the slowest step and its inputs rarely change: a hit skips
      # Go and the bind. go.mod carries the Go and gomobile pins, so a toolchain
      # bump misses too.
      - name: Cache Croc.xcframework
        id: xcframework
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: CrocKit/Croc.xcframework
          key: xcframework-${{ steps.xcode.outputs.slices }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('crocmobile/**', 'scripts/build-xcframework.sh', 'scripts/lib.sh') }}

      - if: steps.xcframework.outputs.cache-hit != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: crocmobile/go.mod
          cache-dependency-path: crocmobile/go.sum

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ steps.xcode.outputs.version }}

      - run: brew install xcbeautify

      - name: Restore DerivedData
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dd
          key: deriveddata-${{ matrix.platform }}-${{ steps.xcode.outputs.version }}-${{ github.sha }}
          restore-keys: |
            deriveddata-${{ matrix.platform }}-${{ steps.xcode.outputs.version }}-

      - name: Build Croc.xcframework
        if: steps.xcframework.outputs.cache-hit != 'true'
        env:
          XCFRAMEWORK_TARGETS: ${{ matrix.slices }}
        run: scripts/build-xcframework.sh

      # The index store only serves an IDE, so CI skips writing it.
      - name: ${{ matrix.action == 'test' && 'Build and test' || 'Build' }} CrocApp
        shell: bash
        working-directory: app
        env:
          DESTINATION: ${{ matrix.destination }}
          ACTION: ${{ matrix.action }}
        run: |
          set -o pipefail
          xcodebuild -scheme CrocApp \
            -destination "$DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            "$ACTION" \
            | xcbeautify --renderer github-actions

      # Also builds every CrocKit target, crockit-verify included, for the host.
      - name: Test CrocKit
        if: matrix.platform == 'macOS'
        shell: bash
        run: set -o pipefail && swift test --package-path CrocKit -Xswiftc -warnings-as-errors 2>&1 | xcbeautify --renderer github-actions

      # Last: it writes CrocApp.app into the same DerivedData as the test step.
      - name: Build CrocApp Direct
        if: matrix.platform == 'macOS'
        shell: bash
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild -scheme 'CrocApp Direct' \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            build \
            | xcbeautify --renderer github-actions

      - name: Save DerivedData
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dd
          key: deriveddata-${{ matrix.platform }}-${{ steps.xcode.outputs.version }}-${{ github.sha }}

  # The one required check. A job skipped by `if:` counts as passed, but a
  # skipped matrix job reports under its unexpanded name and stays pending, so
  # branch protection requires this aggregate instead of the individual jobs.
  pass:
    name: ci pass

    needs: [changes, swift-format, go, contrast, shellcheck, docs, site, interop, build]

    if: ${{ always() }}

    runs-on: ubuntu-26.04

    timeout-minutes: 5

    steps:
      - name: Fail unless every job succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "error: a required job finished as '$result'"; exit 1 ;;
            esac
          done
