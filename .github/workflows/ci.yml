name: CI pass

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # No workflow-level `paths:`: a filtered-out workflow never reports, which
  # leaves a required check pending forever. Jobs skip via `if:` instead.
  changes:
    name: changes

    runs-on: ubuntu-26.04

    timeout-minutes: 5

    outputs:
      swift: ${{ steps.filter.outputs.swift }}
      go: ${{ steps.filter.outputs.go }}
      build: ${{ steps.filter.outputs.build }}
      design: ${{ steps.filter.outputs.design }}
      interop: ${{ steps.filter.outputs.interop }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          # A new branch push has an all-zero `before`, a force push may point at
          # a commit the clone no longer has: run everything rather than guess.
          all=""
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          else
            files=""
            all=1
          fi

          out() {
            if [ -n "$all" ] || grep -qE "$2" <<<"$files"; then
              echo "$1=true"
            else
              echo "$1=false"
            fi
          }

          {
            out swift '^(app|CrocKit)/|^\.swift-format$|^\.xcode-version$|^scripts/format-swift\.sh$|^\.github/workflows/(ci|reusable-swift-format)\.yml$'
            out go '^crocmobile/|^\.github/workflows/(ci|reusable-go)\.yml$'
            out build '^(app|CrocKit|crocmobile)/|^scripts/build-xcframework\.sh$|^\.xcode-version$|^\.github/workflows/ci\.yml$'
            out design '^design/|^app/.*\.swift$|^app/CrocApp/Assets\.xcassets/|^web/landing/.*\.(css|html)$|^web/docs/src/css/|^scripts/(lib|verify-contrast|verify-design)\.sh$|^\.github/workflows/ci\.yml$'
            out interop '^(crocmobile|CrocKit)/|^scripts/(lib|verify-interop)\.sh$|^scripts/croc-v10\.version$|^\.github/workflows/ci\.yml$'
          } | tee -a "$GITHUB_OUTPUT"

  swift-format:
    needs: changes

    if: needs.changes.outputs.swift == 'true'

    uses: ./.github/workflows/reusable-swift-format.yml

  go:
    needs: changes

    if: needs.changes.outputs.go == 'true'

    uses: ./.github/workflows/reusable-go.yml

  contrast:
    name: design checks

    needs: changes

    if: needs.changes.outputs.design == 'true'

    runs-on: ubuntu-26.04

    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: scripts/verify-contrast.sh

      - run: scripts/verify-design.sh

  # The interop harness against a relay on localhost, never the public relays:
  # those rate-limit a shared runner address and make the run flaky. The
  # public-pool scenario stays a local run (docs/BUILDING.md).
  interop:
    name: interop (local relay)

    needs: changes

    if: needs.changes.outputs.interop == 'true'

    runs-on: macos-26

    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: crocmobile/go.mod
          cache-dependency-path: crocmobile/go.sum

      # The CLI peer must match the croc the engine embeds: Homebrew's bottle
      # lagged at 11.5.0, which has no `croc store`.
      - name: Install the croc CLI at the engine version
        shell: bash
        run: |
          set -euo pipefail
          v=$(cd crocmobile && go list -m -f '{{.Version}}' github.com/schollz/croc/v11)
          GOBIN="$RUNNER_TEMP/croc11" go install "github.com/schollz/croc/v11@$v"

      # The R8 scenario's croc v10 peer.
      - run: go install "github.com/schollz/croc/v10@$(cat scripts/croc-v10.version)"

      # Admission limits raised as a margin: every connection comes from
      # 127.0.0.1, which a relay admits 30 times a minute by default.
      - name: Interop against a local croc relay
        shell: bash
        run: |
          set -euo pipefail
          croc="$RUNNER_TEMP/croc11/croc"
          "$croc" relay --host 127.0.0.1 --ports 9309,9310,9311,9312,9313 \
            --source-join-limit 1000 --room-join-limit 1000 > "$RUNNER_TEMP/relay.log" 2>&1 &
          for _ in $(seq 50); do nc -z 127.0.0.1 9309 && break; sleep 0.2; done
          CROC="$croc" CROC_V10="$(go env GOPATH)/bin/croc" RELAY=127.0.0.1:9309 scripts/verify-interop.sh

  build:
    name: build (${{ matrix.platform }})

    needs: changes

    if: needs.changes.outputs.build == 'true'

    runs-on: xcode-27

    timeout-minutes: 30

    strategy:
      fail-fast: false

      matrix:
        include:
          - platform: macOS
            destination: platform=macOS
          - platform: iOS Simulator
            destination: generic/platform=iOS Simulator

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: crocmobile/go.mod
          cache-dependency-path: crocmobile/go.sum

      - id: xcode
        run: echo "version=$(cat .xcode-version)" >> "$GITHUB_OUTPUT"

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ steps.xcode.outputs.version }}

      - run: brew install xcbeautify

      - name: Restore DerivedData
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dd
          key: deriveddata-${{ matrix.platform }}-${{ steps.xcode.outputs.version }}-${{ github.sha }}
          restore-keys: |
            deriveddata-${{ matrix.platform }}-${{ steps.xcode.outputs.version }}-

      - name: Build Croc.xcframework
        run: scripts/build-xcframework.sh

      - name: Build CrocApp
        shell: bash
        working-directory: app
        env:
          DESTINATION: ${{ matrix.destination }}
        run: |
          set -o pipefail
          xcodebuild -scheme CrocApp \
            -destination "$DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            build \
            | xcbeautify --renderer github-actions

      # Also builds every CrocKit target, crockit-verify included, for the host.
      - name: Test CrocKit
        if: matrix.platform == 'macOS'
        shell: bash
        run: set -o pipefail && swift test --package-path CrocKit -Xswiftc -warnings-as-errors 2>&1 | xcbeautify --renderer github-actions

      - name: Test CrocApp
        if: matrix.platform == 'macOS'
        shell: bash
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild -scheme CrocApp \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            test \
            | xcbeautify --renderer github-actions

      # Last: it writes CrocApp.app into the same DerivedData as the test step.
      - name: Build CrocApp Direct
        if: matrix.platform == 'macOS'
        shell: bash
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild -scheme 'CrocApp Direct' \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            build \
            | xcbeautify --renderer github-actions

      - name: Save DerivedData
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dd
          key: deriveddata-${{ matrix.platform }}-${{ steps.xcode.outputs.version }}-${{ github.sha }}

  # The one required check. A job skipped by `if:` counts as passed, but a
  # skipped matrix job reports under its unexpanded name and stays pending, so
  # branch protection requires this aggregate instead of the individual jobs.
  pass:
    name: ci pass

    needs: [changes, swift-format, go, contrast, interop, build]

    if: ${{ always() }}

    runs-on: ubuntu-26.04

    timeout-minutes: 5

    steps:
      - name: Fail unless every job succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "error: a required job finished as '$result'"; exit 1 ;;
            esac
          done
