name: CI pass

on:
  push:
    branches: [main]
    paths: &code-paths
      - "app/**"
      - "CrocKit/**"
      - "crocmobile/**"
      - "scripts/build-xcframework.sh"
      - ".swift-format"
      - ".xcode-version"
      - ".github/workflows/ci.yml"
      - ".github/workflows/reusable-go.yml"
      - ".github/workflows/reusable-swift-format.yml"
  pull_request:
    paths: *code-paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swift-format:
    uses: ./.github/workflows/reusable-swift-format.yml

  go:
    uses: ./.github/workflows/reusable-go.yml

  format-comment:
    name: format comment

    needs: swift-format

    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}

    runs-on: ubuntu-24.04

    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LINT_RESULT: ${{ needs.swift-format.result }}
        with:
          script: |
            const marker = "<!-- swift-format-lint -->";
            const failed = process.env.LINT_RESULT !== "success";
            const body = failed
              ? `${marker}\n### Formatting check failed\n\nFormat the code and push a new commit to fix this.`
              : `${marker}\n### Formatting check passed\n\nPreviously flagged formatting is fixed.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else if (failed) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

  build:
    name: build (${{ matrix.platform }})

    runs-on: macos-26

    timeout-minutes: 30

    strategy:
      fail-fast: false

      matrix:
        include:
          - platform: macOS
            destination: platform=macOS
          - platform: iOS Simulator
            destination: generic/platform=iOS Simulator

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: crocmobile/go.mod
          cache-dependency-path: crocmobile/go.sum

      - id: xcode
        run: echo "version=$(cat .xcode-version)" >> "$GITHUB_OUTPUT"

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ steps.xcode.outputs.version }}

      - run: brew install xcbeautify

      - name: Restore DerivedData
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dd
          key: deriveddata-${{ matrix.platform }}-${{ steps.xcode.outputs.version }}-${{ github.sha }}
          restore-keys: |
            deriveddata-${{ matrix.platform }}-${{ steps.xcode.outputs.version }}-

      - name: Build Croc.xcframework
        run: scripts/build-xcframework.sh

      - name: Build CrocKit package
        shell: bash
        run: set -o pipefail && swift build --package-path CrocKit 2>&1 | xcbeautify --renderer github-actions

      - name: Build CrocApp
        shell: bash
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild -scheme CrocApp \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            build \
            | xcbeautify --renderer github-actions

      - name: Save DerivedData
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dd
          key: deriveddata-${{ matrix.platform }}-${{ steps.xcode.outputs.version }}-${{ github.sha }}
