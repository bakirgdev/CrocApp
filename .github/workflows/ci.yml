name: CI pass

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # No workflow-level `paths:`: a filtered-out workflow never reports, which
  # leaves a required check pending forever. Jobs skip via `if:` instead.
  changes:
    name: changes

    runs-on: ubuntu-24.04

    timeout-minutes: 5

    outputs:
      swift: ${{ steps.filter.outputs.swift }}
      go: ${{ steps.filter.outputs.go }}
      build: ${{ steps.filter.outputs.build }}
      design: ${{ steps.filter.outputs.design }}
      interop: ${{ steps.filter.outputs.interop }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          # A new branch push has an all-zero `before`, a force push may point at
          # a commit the clone no longer has: run everything rather than guess.
          all=""
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          else
            files=""
            all=1
          fi

          out() {
            if [ -n "$all" ] || grep -qE "$2" <<<"$files"; then
              echo "$1=true"
            else
              echo "$1=false"
            fi
          }

          {
            out swift '^(app|CrocKit)/|^\.swift-format$|^\.xcode-version$|^scripts/format-swift\.sh$|^\.github/workflows/(ci|reusable-swift-format)\.yml$'
            out go '^crocmobile/|^\.github/workflows/(ci|reusable-go)\.yml$'
            out build '^(app|CrocKit|crocmobile)/|^scripts/build-xcframework\.sh$|^\.xcode-version$|^\.github/workflows/ci\.yml$'
            out design '^design/|^scripts/(lib|verify-contrast)\.sh$|^\.github/workflows/ci\.yml$'
            out interop '^(crocmobile|CrocKit)/|^scripts/(lib|verify-interop)\.sh$|^scripts/croc-v10\.version$|^\.github/workflows/ci\.yml$'
          } | tee -a "$GITHUB_OUTPUT"

  swift-format:
    needs: changes

    if: needs.changes.outputs.swift == 'true'

    uses: ./.github/workflows/reusable-swift-format.yml

  go:
    needs: changes

    if: needs.changes.outputs.go == 'true'

    uses: ./.github/workflows/reusable-go.yml

  contrast:
    name: contrast

    needs: changes

    if: needs.changes.outputs.design == 'true'

    runs-on: ubuntu-24.04

    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: scripts/verify-contrast.sh

  # The interop harness against a relay on localhost, never the public relays:
  # those rate-limit a shared runner address and make the run flaky. The
  # public-pool scenario stays a local run (docs/BUILDING.md).
  interop:
    name: interop (local relay)

    needs: changes

    if: needs.changes.outputs.interop == 'true'

    runs-on: macos-26

    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: crocmobile/go.mod
          cache-dependency-path: crocmobile/go.sum

      - run: brew install croc

      # The R8 scenario's croc v10 peer.
      - run: go install "github.com/schollz/croc/v10@$(cat scripts/croc-v10.version)"

      # Admission limits raised as a margin: every connection comes from
      # 127.0.0.1, which a relay admits 30 times a minute by default.
      - name: Interop against a local croc relay
        shell: bash
        run: |
          set -euo pipefail
          croc=$(brew --prefix)/bin/croc
          "$croc" relay --host 127.0.0.1 --ports 9309,9310,9311,9312,9313 \
            --source-join-limit 1000 --room-join-limit 1000 > "$RUNNER_TEMP/relay.log" 2>&1 &
          for _ in $(seq 50); do nc -z 127.0.0.1 9309 && break; sleep 0.2; done
          CROC="$croc" CROC_V10="$(go env GOPATH)/bin/croc" RELAY=127.0.0.1:9309 scripts/verify-interop.sh

  format-comment:
    name: format comment

    needs: swift-format

    if: ${{ !cancelled() && needs.swift-format.result != 'skipped' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}

    runs-on: ubuntu-24.04

    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LINT_RESULT: ${{ needs.swift-format.result }}
        with:
          script: |
            const marker = "<!-- swift-format-lint -->";
            const failed = process.env.LINT_RESULT !== "success";
            const body = failed
              ? `${marker}\n### Formatting check failed\n\nFormat the code and push a new commit to fix this.`
              : `${marker}\n### Formatting check passed\n\nPreviously flagged formatting is fixed.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else if (failed) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

  build:
    name: build (${{ matrix.platform }})

    needs: changes

    if: needs.changes.outputs.build == 'true'

    runs-on: xcode-27

    timeout-minutes: 30

    strategy:
      fail-fast: false

      matrix:
        include:
          - platform: macOS
            destination: platform=macOS
          - platform: iOS Simulator
            destination: generic/platform=iOS Simulator

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: crocmobile/go.mod
          cache-dependency-path: crocmobile/go.sum

      - id: xcode
        run: echo "version=$(cat .xcode-version)" >> "$GITHUB_OUTPUT"

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ steps.xcode.outputs.version }}

      - run: brew install xcbeautify

      - name: Restore DerivedData
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dd
          key: deriveddata-${{ matrix.platform }}-${{ steps.xcode.outputs.version }}-${{ github.sha }}
          restore-keys: |
            deriveddata-${{ matrix.platform }}-${{ steps.xcode.outputs.version }}-

      - name: Build Croc.xcframework
        run: scripts/build-xcframework.sh

      - name: Build CrocKit package
        shell: bash
        run: set -o pipefail && swift build --package-path CrocKit 2>&1 | xcbeautify --renderer github-actions

      - name: Build CrocApp
        shell: bash
        working-directory: app
        env:
          DESTINATION: ${{ matrix.destination }}
        run: |
          set -o pipefail
          xcodebuild -scheme CrocApp \
            -destination "$DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            build \
            | xcbeautify --renderer github-actions

      - name: Test CrocKit
        if: matrix.platform == 'macOS'
        shell: bash
        run: set -o pipefail && swift test --package-path CrocKit 2>&1 | xcbeautify --renderer github-actions

      - name: Test CrocApp
        if: matrix.platform == 'macOS'
        shell: bash
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild -scheme CrocApp \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            test \
            | xcbeautify --renderer github-actions

      # Last: it writes CrocApp.app into the same DerivedData as the test step.
      - name: Build CrocApp Direct
        if: matrix.platform == 'macOS'
        shell: bash
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild -scheme 'CrocApp Direct' \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            build \
            | xcbeautify --renderer github-actions

      - name: Save DerivedData
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dd
          key: deriveddata-${{ matrix.platform }}-${{ steps.xcode.outputs.version }}-${{ github.sha }}

  # The one required check. A job skipped by `if:` counts as passed, but a
  # skipped matrix job reports under its unexpanded name and stays pending, so
  # branch protection requires this aggregate instead of the individual jobs.
  pass:
    name: ci pass

    needs: [changes, swift-format, go, contrast, interop, build]

    if: ${{ always() }}

    runs-on: ubuntu-24.04

    timeout-minutes: 5

    steps:
      - name: Fail unless every job succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "error: a required job finished as '$result'"; exit 1 ;;
            esac
          done
