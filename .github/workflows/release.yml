name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  swift-format:
    uses: ./.github/workflows/reusable-swift-format.yml

  go:
    uses: ./.github/workflows/reusable-go.yml

  build:
    name: build

    needs: [swift-format, go]

    runs-on: macos-26

    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write
      attestations: write

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the version and the release notes
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"

          case "$version" in
            *[!0-9.]* | "" | *..*) echo "error: '$version' is not a plain dotted version"; exit 1 ;;
          esac

          declared=$(grep -oE 'MARKETING_VERSION = [^;]+;' app/CrocApp.xcodeproj/project.pbxproj \
            | sed -E 's/MARKETING_VERSION = (.+);/\1/' | sort -u)

          if [ "$(printf '%s\n' "$declared" | wc -l | tr -d ' ')" != "1" ]; then
            echo "error: project.pbxproj declares more than one MARKETING_VERSION:"
            printf '%s\n' "$declared"
            exit 1
          fi

          if [ "$declared" != "$version" ]; then
            echo "error: tag says $version, project.pbxproj says $declared."
            echo "Bump MARKETING_VERSION in a pull request first, then tag the merge commit."
            exit 1
          fi

          # Keep a Changelog heading, date included. The date is not decoration,
          # it is what the section claims about itself, so a heading without one
          # fails the tag rather than shipping wrong.
          if ! grep -qE "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "error: CHANGELOG.md has no '## [$version] - YYYY-MM-DD' heading."
            echo "Rename the '## [Unreleased]' section and date it, then tag again."
            exit 1
          fi

          # The release body is that section, and nothing else. No generated
          # pull-request list appended: the two have to read as the same text,
          # so there is one description of a version, not two. Stops at the next
          # version heading or at the link-reference block that ends the file.
          awk -v v="## [$version]" '
            index($0, v) == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found
          ' CHANGELOG.md > notes.md

          if [ ! -s notes.md ]; then
            echo "error: the '## [$version]' section in CHANGELOG.md is empty."
            exit 1
          fi

          cat notes.md

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: crocmobile/go.mod
          cache-dependency-path: crocmobile/go.sum

      - id: xcode
        run: echo "version=$(cat .xcode-version)" >> "$GITHUB_OUTPUT"

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ steps.xcode.outputs.version }}

      - run: brew install create-dmg xcbeautify

      - name: Build Croc.xcframework
        run: scripts/build-xcframework.sh

      - name: Build CrocApp (Release, ad-hoc signed)
        shell: bash
        working-directory: app
        env:
          DD: ${{ runner.temp }}/dd
        run: |
          set -o pipefail
          xcodebuild -scheme CrocApp \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$DD" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            build \
            | xcbeautify --renderer github-actions

      - name: Assemble the release assets
        shell: bash
        env:
          DD: ${{ runner.temp }}/dd
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          app="$DD/Build/Products/Release/CrocApp.app"
          [ -d "$app" ] || { echo "error: no CrocApp.app at $app"; exit 1; }

          mkdir -p dist
          scripts/build-dmg.sh "$app" "$VERSION" dist

          # ditto, not zip: it preserves the bundle's symlinks and the code
          # signature, which a plain zip flattens.
          ditto -c -k --keepParent --sequesterRsrc "$app" "dist/CrocApp-$VERSION-arm64.app.zip"
          ditto -c -k --sequesterRsrc CrocKit/Croc.xcframework "dist/Croc.xcframework-$VERSION.zip"

          # Named, not a glob: the checksum file has to cover exactly the files
          # that get published, and dist/ also carries the release notes.
          ( cd dist && shasum -a 256 \
              "CrocApp-$VERSION-arm64.dmg" \
              "CrocApp-$VERSION-arm64.app.zip" \
              "Croc.xcframework-$VERSION.zip" > SHA256SUMS.txt )
          cat dist/SHA256SUMS.txt

          mv notes.md dist/notes.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.dmg
            dist/*.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crocapp-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

  release:
    name: release

    needs: build

    runs-on: ubuntu-24.04

    timeout-minutes: 10

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crocapp-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "CrocApp $VERSION" \
            --notes-file dist/notes.md \
            --verify-tag \
            "dist/CrocApp-$VERSION-arm64.dmg#CrocApp $VERSION (Apple silicon, disk image)" \
            "dist/CrocApp-$VERSION-arm64.app.zip#CrocApp $VERSION (Apple silicon, app bundle)" \
            "dist/Croc.xcframework-$VERSION.zip#Croc.xcframework $VERSION (prebuilt engine)" \
            "dist/SHA256SUMS.txt#Checksums"
