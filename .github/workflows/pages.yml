name: Pages

# Deliberately separate from ci.yml: that workflow is Xcode + Go on macOS
# runners and must never wake up for a CSS change. This one is the inverse —
# it only ever touches web/ and the token file the page consumes.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      # The page never ships its own copy of the tokens (ADR 0015): the
      # assemble step below copies design/tokens.css in. So a token edit is
      # a content change for this site and has to trigger a deploy.
      - "design/tokens.css"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy: a half-published Pages site is worse than
# a queued one. Opposite of ci.yml, which cancels freely.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: build + deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # This is the entire "build". No npm, no generator, no build step —
      # see PLAN.md §2. Two copies and a directory reservation.
      - name: Assemble _site
        run: |
          mkdir -p _site
          cp -R web/landing/. _site/
          # One source of truth for tokens. web/landing/tokens.css is
          # gitignored precisely so this copy is the only way it exists.
          cp design/tokens.css _site/tokens.css
          # Reserves crocapp.dev/docs now so the docs site later is a
          # directory drop, not a workflow rewrite.
          [ -d web/docs ] && cp -R web/docs _site/docs || true

      # CNAME must live inside the artifact. GitHub only generates one for
      # branch-published sites; an Actions deploy that omits it can clear the
      # custom-domain setting on the next run.
      - name: Verify CNAME survived assembly
        run: test -s _site/CNAME && cat _site/CNAME

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
