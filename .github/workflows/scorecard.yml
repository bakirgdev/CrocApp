name: Scorecard

on:
  schedule:
    - cron: "30 5 * * 3"
  branch_protection_rule:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: analysis

    # Scorecard only supports the default branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    runs-on: ubuntu-26.04

    timeout-minutes: 10

    # The job-level permissions and the action list below are required for
    # publish_results; see "Workflow Restrictions" in the scorecard-action README.
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: results.sarif
