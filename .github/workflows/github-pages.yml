name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/landing/**"
      - "web/docs/**"
      - "design/tokens.css"
      - "scripts/assemble-site.sh"
      - ".github/workflows/github-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # needed because Docusaurus's showLastUpdateTime reads each doc page's git history

      - name: Enable pnpm
        run: corepack enable pnpm && corepack prepare --activate
        working-directory: web/docs

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('web/docs/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Assemble _site
        run: scripts/assemble-site.sh

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5.0.0

      - name: Release the Pages deployment if this run is cancelled
        if: cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/$REPO/pages/deployments/$SHA/cancel" || true
