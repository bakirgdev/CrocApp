name: GitHub Pages

on:
  push:
    branches: [main]
    paths: &site-paths
      - "web/landing/**"
      - "web/docs/**"
      - "design/tokens.css"
      - "scripts/assemble-site.sh"
      - ".github/workflows/github-pages.yml"
  pull_request:
    paths: *site-paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build

    runs-on: ubuntu-24.04

    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needed because Docusaurus's showLastUpdateTime reads each doc page's git history
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/docs/.nvmrc

      - name: Enable pnpm
        run: corepack enable pnpm && corepack prepare --activate
        working-directory: web/docs

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('web/docs/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Assemble _site
        run: scripts/assemble-site.sh

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: deploy

    needs: build

    if: github.event_name == 'push'

    runs-on: ubuntu-24.04

    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Release the Pages deployment if this run is cancelled
        if: cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$REPO/pages/deployments/$SHA/cancel" || true
