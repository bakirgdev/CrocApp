name: Weekly pin watch

# Pins Dependabot cannot see (scripts/pin-watch.sh). Keeps one open issue in
# step with the report and closes it once every pin is current.
on:
  schedule:
    # Off the hour: GitHub delays or drops scheduled runs at :00 under load.
    - cron: "37 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pin-watch
  cancel-in-progress: true

jobs:
  pin-watch:
    name: pin watch

    runs-on: ubuntu-26.04

    timeout-minutes: 5

    permissions:
      contents: read
      issues: write # files, updates and closes the pinned-versions issue

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report and sync the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Pinned versions to update"
          rc=0
          scripts/pin-watch.sh > "$RUNNER_TEMP/report.md" || rc=$?
          [ "$rc" -eq 0 ] || [ "$rc" -eq 10 ] || exit "$rc"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          issue=$(gh issue list --state open --label dependencies --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ "$rc" -eq 0 ]; then
            [ -z "$issue" ] || gh issue close "$issue" --comment "Every pin is current."
          elif [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file "$RUNNER_TEMP/report.md"
          else
            gh issue create --title "$title" --label dependencies --body-file "$RUNNER_TEMP/report.md"
          fi

  report:
    name: report

    needs: pin-watch

    if: failure()

    runs-on: ubuntu-26.04

    timeout-minutes: 5

    permissions:
      contents: read
      issues: write # files or updates the failure issue

    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = "Weekly pin watch failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "dependencies",
            });
            const existing = openIssues.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing on \`${context.sha}\`: ${runUrl}`,
              });
              return;
            }

            const body = [
              "## The weekly pin watch failed",
              "",
              `**Run:** ${runUrl}`,
              `**Commit:** \`${context.sha}\``,
              "",
              "The pin-watch job failed, so the \"Pinned versions to update\" issue may not be in step. Usually `scripts/pin-watch.sh` exited with something other than 0 (every pin current) or 10 (updates to report).",
              "",
              "### Next steps",
              "1. Open the run log above. A lookup that failed (a release API, a rate limit, a renamed runner label) is the usual cause.",
              "2. Reproduce with `scripts/pin-watch.sh` locally, fix the script or the pin it reads, and close this issue.",
            ].join("\n");

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["bug", "dependencies"],
              assignees: ["bakirgdev"],
            });
