name: Reusable Go checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: checks

    runs-on: ubuntu-26.04

    timeout-minutes: 15

    # GOFLAGS puts the engine's build tag on every go command below, so the
    # checks run on what ships (scripts/build-xcframework.sh).
    env:
      GOOS: darwin
      GOARCH: arm64
      GOFLAGS: -tags=croc_no_tailcat

    defaults:
      run:
        working-directory: crocmobile

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: crocmobile/go.mod
          cache-dependency-path: crocmobile/go.sum

      - run: go build ./...

      - run: go vet ./...

      # The job-level GOOS/GOARCH cross-compile for the bridge; tests must run
      # on this Linux runner, and -race needs a native target.
      - name: go test -race
        run: env -u GOOS -u GOARCH go test -race ./...

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: crocmobile

      - name: govulncheck
        run: |
          env -u GOOS -u GOARCH go build -o "$RUNNER_TEMP/govulncheck" golang.org/x/vuln/cmd/govulncheck
          "$RUNNER_TEMP/govulncheck" ./...
