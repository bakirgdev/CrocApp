name: govulncheck (scheduled)

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck

    runs-on: ubuntu-latest

    env:
      GOOS: darwin
      GOARCH: arm64

    defaults:
      run:
        working-directory: crocmobile

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: crocmobile/go.mod
          cache-dependency-path: crocmobile/go.sum

      - name: govulncheck
        run: |
          env -u GOOS -u GOARCH go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(env -u GOOS -u GOARCH go env GOPATH)/bin/govulncheck" ./...
