name: Feature request

description: Suggest a capability or improvement

labels: ["enhancement"]

body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before filing
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: It is not on the [Unlikely to be merged](https://github.com/bakirgdev/CrocApp/blob/main/CONTRIBUTING.md#unlikely-to-be-merged) list, and it is an app feature, not a change to croc itself (that goes [upstream](https://github.com/schollz/croc)).
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the app makes hard or impossible?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the app do instead? Sketches and screenshots welcome.
    validations:
      required: true

  - type: input
    id: croc-equivalent
    attributes:
      label: croc CLI equivalent
      description: If croc already does this, name the flag or command.
      placeholder: "croc send --no-compress"

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Select every platform this feature should be built for.
      multiple: true
      options:
        - macOS
        - iOS
        - iPadOS
    validations:
      required: true
