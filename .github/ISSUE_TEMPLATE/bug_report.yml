name: Bug report

description: Something in the app is broken or behaves wrong

labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: Check the [known problems](https://github.com/bakirgdev/CrocApp/issues?q=is%3Aissue+label%3Aknown) and [Troubleshooting](https://crocapp.dev/docs/troubleshooting/) first.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Send
        2. Pick a 2 GB file
        3. …
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: App version and platform
      description: The app version from Settings, under About (or the commit SHA for a source build), and the OS (macOS, iOS or iPadOS) with its version.
      placeholder: "<version> (<build>), macOS <version>"
    validations:
      required: true

  - type: dropdown
    id: cli
    attributes:
      label: Does the plain croc CLI show the same?
      description: If it does, the bug belongs [upstream](https://github.com/schollz/croc/issues).
      options:
        - "Yes"
        - "No"
        - Not tried
    validations:
      required: true

  - type: dropdown
    id: relay
    attributes:
      label: Relay
      description: The relay in use when the problem happened.
      options:
        - Default public relay
        - Custom relay
        - Local / LAN only
        - Not sure
        - Not applicable
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Logs and screenshots
      description: Paste console output or attach screenshots. Never paste a transfer code you still intend to use.
