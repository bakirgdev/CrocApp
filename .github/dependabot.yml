version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"

  - package-ecosystem: "gomod"
    directory: "/crocmobile"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      go-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "swift"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      swift-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"

  # Pins Dependabot cannot see are checked by .github/workflows/pin-watch.yml.
  - package-ecosystem: "npm"
    directory: "/web/docs"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      docs-site-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "documentation"
    commit-message:
      prefix: "build"
      include: "scope"
