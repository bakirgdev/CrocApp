version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Waits out the first days of a release, when a compromised one is caught.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Daily, because croc is the only direct requirement and CrocApp ships a croc minor
  # within 7 days of its release: the PR opens on day 3, a patch's on day 1 for
  # review (close it to skip). A security patch skips the cooldown
  # (docs/knowledge/croc-upgrade-playbook.md).
  - package-ecosystem: "gomod"
    directory: "/crocmobile"
    schedule:
      interval: "daily"
    cooldown:
      semver-minor-days: 3
      semver-patch-days: 1
      include: ["github.com/schollz/croc/v11"]
    groups:
      go-deps:
        patterns: ["*"]
        exclude-patterns: ["github.com/schollz/croc/v11"]
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "swift"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      swift-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"

  # Pins Dependabot cannot see are checked by .github/workflows/pin-watch.yml.
  - package-ecosystem: "npm"
    directory: "/web/docs"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      docs-site-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "documentation"
    commit-message:
      prefix: "build"
      include: "scope"
