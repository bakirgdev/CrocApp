version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Waits out the first days of a release, when a compromised one is caught.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Daily, because croc is the only direct requirement and CrocApp ships a croc minor
  # within 7 days of its release: the PR opens on day 3, a patch's on day 1 for
  # review (close it to skip). A security patch skips the cooldown
  # (docs/knowledge/croc-upgrade-playbook.md).
  - package-ecosystem: "gomod"
    directory: "/crocmobile"
    schedule:
      interval: "daily"
    cooldown:
      semver-minor-days: 3
      semver-patch-days: 1
      include: ["github.com/schollz/croc/v11"]
    groups:
      go-deps:
        patterns: ["*"]
        exclude-patterns: ["github.com/schollz/croc/v11"]
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "build"
      include: "scope"

  # The relay's croc image (relay/compose.yml), merged by relay-automerge.yml.
  # The cooldown waits out a broken release; a major can change the protocol or
  # the relay pool, so it waits for a person.
  - package-ecosystem: "docker-compose"
    directory: "/relay"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "schollz/croc"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
