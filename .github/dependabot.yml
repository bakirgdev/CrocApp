version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"

  - package-ecosystem: "gomod"
    directory: "/crocmobile"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      go-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "swift"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      swift-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"

  # Monthly: the docs site churns weekly and none of it ships in the app.
  - package-ecosystem: "npm"
    directory: "/web/docs"
    schedule:
      interval: "monthly"
    groups:
      docs-site-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "documentation"
    commit-message:
      prefix: "build"
      include: "scope"
