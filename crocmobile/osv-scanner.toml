# Read by OpenSSF Scorecard's Vulnerabilities check. Remove an entry when its reason no longer holds: x/crypto drops openpgp, or a dependency starts importing it.

[[IgnoredVulns]]
id = "GO-2026-5932"
reason = "golang.org/x/crypto/openpgp is never imported: croc imports only x/crypto's argon2, chacha20poly1305, hkdf, pbkdf2 and ssh packages, and govulncheck reports the vulnerability as not called. No fixed x/crypto version exists."
