<!doctype html>
<!--
  Social card source — development artifact, NOT part of the site.

  .github/workflows/pages.yml strips this from _site. It lives in git because
  the card has to be rebuildable when a token moves: render it with
  scripts/build-og.sh, which screenshots this at exactly 1200x630 and writes
  assets/img/og.jpg.

  Locked to the light theme on purpose. A social card is a fixed image; it
  cannot respond to the viewer's theme, so it must not depend on one.
-->
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>CrocApp social card</title>
    <link rel="stylesheet" href="tokens.css" />
    <style>
      /* 1200x630 is the OG spec (1.91:1). Every value below is a token; the
         two dimensions are the only literals, and they are the format. */
      body {
        display: flex;
        gap: var(--space-11);
        align-items: center;
        width: 1200px;
        height: 630px;
        padding: var(--space-11);
        margin: 0;
        background: var(--color-surface-base);
        overflow: hidden;
      }

      /* Full height with the three elements pushed apart, rather than a
         centred clump: a 1.91:1 card is wide and short, and a centred block
         leaves obvious dead space along the bottom edge. */
      .card__copy {
        display: flex;
        flex: 1;
        flex-direction: column;
        justify-content: space-between;
        align-self: stretch;
        min-width: 0;
      }

      .card__wordmark {
        display: flex;
        gap: var(--space-3);
        align-items: center;
        font-size: var(--type-title2-size);
        font-weight: var(--weight-bold);
        letter-spacing: var(--tracking-title2);
        color: var(--color-text-primary);
      }

      .card__mark {
        width: var(--space-9);
        height: var(--space-9);
        color: var(--color-accent);
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .card__title {
        margin: 0;
        font-family: var(--font-sans);
        font-size: var(--type-web-hero-size);
        line-height: var(--type-web-hero-lh);
        font-weight: var(--type-web-hero-weight);
        letter-spacing: var(--tracking-web-hero);
        color: var(--color-text-primary);
      }

      .card__url {
        font-size: var(--type-web-sub-size);
        font-weight: var(--weight-semibold);
        letter-spacing: var(--tracking-web-lead);
        color: var(--color-accent-text);
      }

      .card__mascot {
        flex: none;
        width: 360px;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="card__copy">
      <div class="card__wordmark">
        <svg class="card__mark" viewBox="0 0 24 24" aria-hidden="true">
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
        CrocApp
      </div>

      <h1 class="card__title">Send files anywhere. Encrypted end to end.</h1>

      <div class="card__url">crocapp.dev</div>
    </div>

    <img class="card__mascot" src="assets/img/mascot.png" alt="" />
  </body>
</html>
